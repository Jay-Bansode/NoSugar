version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript is pinned to ~5.9 (CLAUDE.md §12): typescript-eslint and the Nest tooling
      # don't support TypeScript 7 yet. Remove this when they do, and upgrade by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
