name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brand
          POSTGRES_PASSWORD: brand
          POSTGRES_DB: brand
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brand -d brand"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Only the db steps use this; unit/e2e tests never touch the database.
      CI_DATABASE_URL: postgresql://brand:brand@localhost:5432/brand?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm --filter @brand/api db:deploy
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Check schema and migrations are in sync
        working-directory: apps/api
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Database + Redis integration tests
        run: pnpm --filter @brand/api test:db
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          REDIS_URL: redis://localhost:6379

      - name: Seed (idempotency check)
        run: pnpm --filter @brand/api db:seed && pnpm --filter @brand/api db:seed
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
